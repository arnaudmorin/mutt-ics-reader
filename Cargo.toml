[package]
name = "mutt-ics-reader"
version = "0.1.0"
edition = "2024"
authors = ["Arnaud Morin"]
license = "Apache-2.0"
description = "Read iCalendar (.ics) invitations in the terminal, as a TUI or as plain text for mutt/neomutt"

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
icalendar = "0.17.14"
ratatui = "0.30.2"
windows-timezones = { version = "0.5.1", features = ["chrono-tz"] }
